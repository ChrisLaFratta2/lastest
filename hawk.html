<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>CCR Golf</title>
<style>
  :root{
    --pine:#122A1E;
    --pine-dark:#0B1D14;
    --fairway:#1F4430;
    --fairway-light:#2B5A3D;
    --cream:#F1E8D2;
    --cream-dim:#D9CDAE;
    --gold:#C99A2E;
    --gold-bright:#E4B84A;
    --rust:#A63A2E;
    --ink:#182015;
    --line: rgba(241,232,210,0.18);
    font-size:16px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:
      radial-gradient(circle at 20% 0%, var(--fairway-light) 0%, var(--pine) 45%, var(--pine-dark) 100%);
    color:var(--cream);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    min-height:100vh;
    padding-bottom:40px;
  }
  .wrap{max-width:640px;margin:0 auto;padding:18px 16px 60px;}

  header.top{
    display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;row-gap:10px;
    padding:6px 2px 18px;border-bottom:1px solid var(--line);margin-bottom:18px;
  }
  .brand{display:flex;align-items:center;gap:10px;}
  .brand .mark{
    width:34px;height:34px;border-radius:50%;
    background:linear-gradient(160deg,var(--gold-bright),var(--gold));
    display:flex;align-items:center;justify-content:center;font-size:18px;
    box-shadow:0 2px 6px rgba(0,0,0,0.35);
  }
  .brand h1{
    font-family:Georgia,'Times New Roman',serif;font-weight:700;
    font-size:1.5rem;letter-spacing:0.04em;margin:0;color:var(--cream);
    text-transform:uppercase;
  }
  .brand .sub{font-size:0.68rem;letter-spacing:0.18em;text-transform:uppercase;color:var(--cream-dim);margin-top:1px;}
  nav.tabs{display:flex;gap:6px;flex-wrap:wrap;}
  nav.tabs button{
    background:transparent;border:1px solid var(--line);color:var(--cream-dim);
    padding:7px 11px;border-radius:20px;font-size:0.72rem;letter-spacing:0.06em;
    text-transform:uppercase;cursor:pointer;font-family:inherit;
  }
  nav.tabs button.active{background:var(--gold);border-color:var(--gold);color:var(--ink);font-weight:700;}

  h2.section-title{
    font-family:Georgia,'Times New Roman',serif;font-size:1.15rem;letter-spacing:0.03em;
    color:var(--gold-bright);margin:0 0 12px;text-transform:uppercase;
  }
  .card{
    background:linear-gradient(180deg,rgba(241,232,210,0.06),rgba(241,232,210,0.02));
    border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:16px;
  }
  label{display:block;font-size:0.75rem;letter-spacing:0.05em;text-transform:uppercase;color:var(--cream-dim);margin-bottom:6px;}
  input[type=text],input[type=number],select{
    width:100%;background:var(--pine-dark);border:1px solid var(--line);color:var(--cream);
    padding:10px 11px;border-radius:8px;font-size:1rem;font-family:inherit;
  }
  input:focus,select:focus{outline:2px solid var(--gold);outline-offset:1px;}
  .row{display:flex;gap:10px;flex-wrap:wrap;}
  .row > *{flex:1;min-width:120px;}
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:6px;
    background:var(--gold);color:var(--ink);border:none;border-radius:9px;
    padding:11px 16px;font-weight:700;font-size:0.9rem;cursor:pointer;font-family:inherit;
    letter-spacing:0.02em;
  }
  .btn.secondary{background:transparent;color:var(--cream);border:1px solid var(--line);}
  .btn.ghost{background:transparent;color:var(--cream-dim);border:1px dashed var(--line);}
  .btn.danger{background:var(--rust);color:var(--cream);}
  .btn:disabled{opacity:0.35;cursor:not-allowed;}
  .btn-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px;}

  .player-chip{
    display:flex;align-items:center;gap:8px;padding:9px 12px;border-radius:9px;
    border:1px solid var(--line);cursor:pointer;background:rgba(0,0,0,0.15);
    font-size:0.92rem;
  }
  .player-chip.selected{border-color:var(--gold);background:rgba(201,154,46,0.18);}
  .player-chip .dot{width:9px;height:9px;border-radius:50%;background:var(--fairway-light);}
  .order-list{display:flex;flex-direction:column;gap:8px;}
  .order-row{display:flex;align-items:center;gap:10px;background:rgba(0,0,0,0.15);
    border:1px solid var(--line);border-radius:9px;padding:8px 10px;}
  .order-row .num{width:24px;height:24px;border-radius:50%;background:var(--gold);color:var(--ink);
    display:flex;align-items:center;justify-content:center;font-weight:700;font-size:0.78rem;flex:none;}
  .order-row .name{flex:1;}
  .order-row .arrows{display:flex;gap:4px;}
  .order-row .arrows button{background:transparent;border:1px solid var(--line);color:var(--cream);
    border-radius:6px;width:26px;height:26px;cursor:pointer;}
  .drag-handle{cursor:grab;padding:6px 8px;margin:-6px -4px -6px 0;color:var(--cream-dim);
    font-size:1.05rem;line-height:1;letter-spacing:-2px;touch-action:none;user-select:none;flex:none;}
  .drag-handle:active{cursor:grabbing;}
  .order-row.dragging{box-shadow:0 8px 20px rgba(0,0,0,0.45);background:rgba(201,154,46,0.14);
    border-color:var(--gold);}

  .hole-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px;flex-wrap:wrap;gap:10px;}
  .hole-head .hole-num{font-family:Georgia,serif;font-size:2rem;font-weight:700;color:var(--cream);line-height:1;}
  .hole-head .hole-meta{font-size:0.72rem;color:var(--cream-dim);letter-spacing:0.05em;text-transform:uppercase;margin-top:4px;}
  .hawk-hole-flag{background:var(--rust);color:var(--cream);font-size:0.65rem;padding:3px 8px;border-radius:6px;
    letter-spacing:0.08em;text-transform:uppercase;font-weight:700;}

  table.ref-table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;}
  table.ref-table th{
    text-align:left;font-size:0.68rem;letter-spacing:0.05em;text-transform:uppercase;color:var(--cream-dim);
    padding:6px 6px;border-bottom:1px solid var(--line);
  }
  table.ref-table td{padding:6px 6px;border-bottom:1px solid rgba(241,232,210,0.08);vertical-align:middle;}

  .team-tag{font-size:0.65rem;padding:2px 7px;border-radius:6px;letter-spacing:0.04em;text-transform:uppercase;font-weight:700;}
  .team-tag.hawk{background:var(--gold);color:var(--ink);}
  .team-tag.other{background:var(--fairway-light);color:var(--cream);}
  .team-tag.solo{background:var(--rust);color:var(--cream);}

  .money{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-weight:700;}
  .money.pos{color:#8FBF8A;}
  .money.neg{color:#E08D82;}
  .money.zero{color:var(--cream-dim);}

  .toggle-line{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:10px 0;}
  .toggle-line .desc{font-size:0.82rem;color:var(--cream-dim);line-height:1.4;flex:1;}
  .switch{position:relative;display:inline-block;width:46px;height:26px;flex:none;}
  .switch input{opacity:0;width:0;height:0;}
  .switch .slider{position:absolute;cursor:pointer;inset:0;background:rgba(241,232,210,0.18);
    border-radius:26px;transition:0.15s;}
  .switch .slider:before{position:absolute;content:"";height:20px;width:20px;left:3px;bottom:3px;
    background:var(--cream);border-radius:50%;transition:0.15s;}
  .switch input:checked + .slider{background:var(--gold);}
  .switch input:checked + .slider:before{transform:translateX(20px);background:var(--ink);}

  .summary-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;
    border-bottom:1px solid rgba(241,232,210,0.08);}
  .summary-row:last-child{border-bottom:none;}
  .standing-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid rgba(241,232,210,0.08);}
  .standing-row:last-child{border-bottom:none;}
  .standing-rank{width:22px;font-family:Georgia,serif;font-weight:700;color:var(--gold-bright);}
  .standing-name{flex:1;}
  .note{font-size:0.78rem;color:var(--cream-dim);line-height:1.5;margin-top:6px;}
  .history-hole{display:flex;justify-content:space-between;align-items:center;padding:10px 0;
    border-bottom:1px solid rgba(241,232,210,0.08);cursor:pointer;}
  .history-hole:last-child{border-bottom:none;}
  .empty{text-align:center;padding:30px 10px;color:var(--cream-dim);}
  .helptext{font-size:0.7rem;color:var(--cream-dim);margin-top:4px;}
  .winner-btn{padding:14px 16px;}
  .winner-btn.chosen{outline:2px solid var(--gold-bright);}
  .roster-popup{
    position:fixed;left:16px;right:16px;bottom:16px;max-width:608px;margin:0 auto;
    background:linear-gradient(180deg,var(--fairway-light),var(--fairway));
    border:1px solid var(--gold);border-radius:14px;padding:16px;
    box-shadow:0 12px 32px rgba(0,0,0,0.55);z-index:50;
  }
  .mode-card{
    display:flex;align-items:center;gap:14px;width:100%;text-align:left;
    background:linear-gradient(180deg,rgba(241,232,210,0.08),rgba(241,232,210,0.02));
    border:1px solid var(--line);border-radius:14px;padding:18px 16px;margin-bottom:14px;
    cursor:pointer;color:var(--cream);font-family:inherit;
  }
  .mode-card:hover{border-color:var(--gold);}
  .mode-card .mode-icon{font-size:1.8rem;flex:none;width:44px;text-align:center;}
  .mode-card .mode-title{font-family:Georgia,serif;font-size:1.15rem;color:var(--gold-bright);margin-bottom:2px;}
  .mode-card .mode-desc{font-size:0.8rem;color:var(--cream-dim);}
  .mode-card.disabled{opacity:0.45;cursor:not-allowed;}
  .tee-swatch{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:7px;
    box-shadow:inset 0 0 0 1px rgba(0,0,0,0.35);vertical-align:middle;}
  .score-entry-block{padding:12px 0;border-bottom:1px solid rgba(241,232,210,0.08);}
  .score-entry-block:last-child{border-bottom:none;}
  .score-entry-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;flex-wrap:wrap;gap:6px;}
  .score-entry-name{font-weight:700;}
  .score-entry-meta{font-size:0.72rem;color:var(--cream-dim);}
  .score-btn-row{display:flex;gap:10px;flex-wrap:wrap;margin:2px 0 2px;}
  .score-btn-wrap{display:flex;flex-direction:column;align-items:center;gap:4px;}
  .score-btn-shape-zone{height:46px;width:34px;display:flex;align-items:center;justify-content:center;}
  .score-btn{
    background:transparent;border:none;padding:4px;cursor:pointer;color:var(--cream);
    display:flex;align-items:center;justify-content:center;border-radius:8px;font-family:inherit;
  }
  .score-btn.active{background:rgba(201,154,46,0.28);}
  .score-btn-label{font-size:0.58rem;letter-spacing:0.03em;text-transform:uppercase;color:var(--cream-dim);}
  .shape-core{width:24px;height:24px;display:flex;align-items:center;justify-content:center;
    font-size:0.82rem;font-weight:700;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:var(--cream);}
  .shape-ring{display:flex;align-items:center;justify-content:center;padding:3px;}
  .shape-ring.circle{border-radius:50%;border:1.5px solid var(--gold-bright);}
  .shape-ring.square{border-radius:3px;border:1.5px solid var(--cream);}
  .score-other-input{
    width:24px;height:24px;background:var(--pine-dark);border:1px dashed var(--cream-dim);
    border-radius:6px;color:var(--cream);text-align:center;font-size:0.7rem;padding:0;font-family:inherit;
    -moz-appearance:textfield;
  }
  .score-other-input::-webkit-outer-spin-button,
  .score-other-input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
  .score-other-input:focus{outline:2px solid var(--gold);}

  /* Print - isolates #print-section (the Scorecard View), forces landscape, and
     shrinks everything so front/back nine + totals + legend fit on one page. */
  @media print{
    @page{ size: landscape; margin: 8mm; }
    body{background:#FFFFFF !important;}
    body *{visibility:hidden;}
    #print-section, #print-section *{visibility:visible;}
    #print-section{position:absolute;left:0;top:0;width:100%;padding:0;}
    .no-print{display:none !important;}
    *{-webkit-print-color-adjust:exact !important;print-color-adjust:exact !important;color-adjust:exact !important;}
    #print-section .card{padding:0 !important;margin-bottom:6px !important;border:none !important;}
    #print-section h2.section-title{font-size:0.85rem !important;margin:0 0 3px !important;}
    #print-section .note{font-size:0.62rem !important;margin:0 0 5px !important;}
    #print-section .sv-tables-wrap{display:flex !important;gap:6mm;}
    #print-section .sv-scroll{overflow:visible !important;border:none !important;flex:1 1 50%;min-width:0;margin-bottom:0 !important;}
    #print-section table.sv-table{min-width:0 !important;width:100% !important;}
    #print-section table.sv-table th, #print-section table.sv-table td{padding:1.5px 3px !important;font-size:0.58rem !important;}
    #print-section table.sv-table th:first-child, #print-section table.sv-table td:first-child{min-width:0 !important;position:static !important;}
    #print-section .summary-row{padding:2px 0 !important;font-size:0.68rem !important;}
    #print-section .sv-legend{font-size:0.55rem !important;gap:8px !important;margin-top:4px !important;}
  }

  /* Traditional Scorecard View - paper aesthetic, scoped separately from the rest of the app */
  .scorecard-view{
    background:#FBF8F0;color:#2A2A22;border:1px solid #DED5BC;
  }
  .scorecard-view h2.section-title{color:#1E3A2F;}
  .scorecard-view .note{color:#6B6455;}
  .scorecard-view .sv-scroll{overflow-x:auto;border:1px solid #DED5BC;border-radius:8px;margin-bottom:14px;}
  table.sv-table{border-collapse:collapse;width:100%;min-width:640px;font-variant-numeric:tabular-nums;}
  table.sv-table th, table.sv-table td{padding:6px 7px;text-align:center;border-bottom:1px solid #DED5BC;font-size:0.78rem;white-space:nowrap;}
  table.sv-table th:first-child, table.sv-table td:first-child{
    position:sticky;left:0;background:#FBF8F0;text-align:left;font-weight:700;min-width:110px;border-right:1px solid #DED5BC;
  }
  table.sv-table thead th{background:#1E3A2F;color:#F5F0E1;font-family:Georgia,serif;font-weight:600;}
  table.sv-table thead th:first-child{background:#1E3A2F;}
  .sv-row-label{font-size:0.65rem;text-transform:uppercase;letter-spacing:0.05em;color:#6B6455 !important;font-weight:700;}
  .sv-outin{font-weight:800;background:rgba(184,147,90,0.22) !important;}
  .scorecard-view .summary-row{border-bottom:1px solid #DED5BC;color:#2A2A22;}
  .sv-legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:12px;font-size:0.72rem;color:#6B6455;}
  .sv-legend .item{display:flex;align-items:center;gap:7px;}
  .mini-core{width:20px;height:20px;display:flex;align-items:center;justify-content:center;margin:0 auto;
    font-size:0.72rem;font-weight:700;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#2A2A22;}
  .mini-input{
    border:none;border-bottom:1px dashed #B8935A;background:transparent;padding:0;text-align:center;
    -moz-appearance:textfield;
  }
  .mini-input::-webkit-outer-spin-button,
  .mini-input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
  .mini-input:focus{outline:none;border-bottom:1.5px solid #A63A2E;background:#FFEA8A;border-radius:3px;color:#2A2A22;}
  .mini-input:hover{background:rgba(184,147,90,0.12);}
  .mini-ring{display:flex;align-items:center;justify-content:center;padding:2px;}
  .mini-ring.circle{border-radius:50%;border:1.2px solid #A63A2E;}
  .mini-ring.square{border-radius:2px;border:1.2px solid #1E3A2F;}
  .sv-cell-wrap{position:relative;display:inline-flex;}
  .sv-stroke-dot{position:absolute;top:-1px;right:-3px;width:6px;height:6px;border-radius:50%;background:#B8935A;}
  .sv-cat-icons{font-size:0.65rem;line-height:1;margin-top:2px;letter-spacing:1px;}
  .bet-hero{
    text-align:center;padding:6px 8px 16px;
    border-bottom:1px solid rgba(241,232,210,0.12);margin-bottom:14px;
  }
  .bet-hero-label{
    font-size:0.72rem;letter-spacing:0.14em;text-transform:uppercase;
    color:var(--cream-dim);margin-bottom:2px;
  }
  .bet-hero-amount{
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    font-size:3.2rem;font-weight:800;line-height:1;color:var(--gold-bright);
    text-shadow:0 0 22px rgba(228,184,74,0.5);
  }
  ::selection{background:var(--gold);color:var(--ink);}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
(function(){
  "use strict";

  const STORAGE_KEY = "hawk-round-v2";
  const ROSTER_KEY = "hawk-saved-players-v1";
  const HOLES_COUNT = 18;
  const HAWK_HOLE_START = 16; // holes 16-18 -> hawk is whoever is down the most

  // ---- COURSE DATA ----
  const COURSES = {
    ccr: {
      id: "ccr",
      name: "Country Club of Roswell",
      defaultTee: "charger",
      // hole handicap (stroke index) ranking, per user-supplied table
      handicap: {

        10:10, 11:16, 12:6, 13:12, 14:2, 15:8, 16:18, 17:4, 18:14
      },

      par: {

        10:4, 11:3, 12:4, 13:5, 14:4, 15:4, 16:3, 17:4, 18:5
      },
      // Tee yardages, from the Country Club of Roswell scorecard (Jul 2026)

        charger:   { label:"Charger (White)",  color:"#D9D2BE", yards:{1:335,2:165,3:398,4:372,5:354,6:519,7:177,8:362,9:358,10:309,11:157,12:356,13:475,14:390,15:358,16:112,17:382,18:493} },
        competitor:{ label:"Competitor (Green)", color:"#3F7A4E", yards:{1:309,2:129,3:376,4:348,5:327,6:507,7:154,8:318,9:343,10:283,11:140,12:327,13:455,14:374,15:350,16:104,17:359,18:472} },
        challenger:{ label:"Challenger (Red)", color:"#A63A2E", yards:{1:291,2:123,3:326,4:314,5:283,6:429,7:146,8:308,9:331,10:250,11:110,12:220,13:374,14:310,15:342,16:80,17:238,18:449} },
        yellow:    { label:"Yellow / Jr", color:"#D9C33B", yards:{1:210,2:85,3:326,4:314,5:283,6:327,7:93,8:263,9:287,10:189,11:110,12:190,13:374,14:286,15:285,16:80,17:200,18:344} }

    },
    stmarlos: {
      id: "stmarlos",
      name: "St. Marlos",
      defaultTee: "white",
      // hole handicap (stroke index) ranking, from the St. Marlos scorecard
      handicap: {
        1:6, 2:2, 3:16, 4:10, 5:12, 6:14, 7:18, 8:4, 9:8,
        10:13, 11:7, 12:1, 13:17, 14:11, 15:3, 16:9, 17:15, 18:5
      },
      // Par per hole, from the St. Marlos scorecard
      par: {
        1:4, 2:4, 3:3, 4:4, 5:5, 6:3, 7:4, 8:5, 9:4,
        10:5, 11:3, 12:4, 13:5, 14:4, 15:4, 16:3, 17:4, 18:4
      },
      // Tee yardages, from the St. Marlos scorecard
      tees: {
        gold:  { label:"Gold",  color:"#C9A227", yards:{1:432,2:474,3:179,4:405,5:577,6:378,7:176,8:377,9:456,10:523,11:190,12:461,13:615,14:391,15:459,16:216,17:351,18:413} },
        blue:  { label:"Blue",  color:"#3B5BA5", yards:{1:405,2:458,3:174,4:395,5:512,6:367,7:161,8:360,9:440,10:496,11:173,12:442,13:497,14:379,15:440,16:193,17:338,18:400} },
        white: { label:"White", color:"#D9D2BE", yards:{1:387,2:399,3:166,4:368,5:477,6:306,7:151,8:341,9:388,10:470,11:138,12:428,13:470,14:368,15:418,16:167,17:308,18:382} },
        red:   { label:"Red",   color:"#A63A2E", yards:{1:294,2:340,3:130,4:305,5:433,6:248,7:128,8:321,9:327,10:411,11:100,12:339,13:397,14:338,15:314,16:141,17:227,18:296} }
      }
    }
  };
  const DEFAULT_HOME_COURSE = "ccr";
  let homeCourse = DEFAULT_HOME_COURSE;

  // "Current course" bindings - read by every PAR[h]/HOLE_HANDICAP[h]/TEES[key] lookup throughout
  // the app. setCourse() repoints these at the start of each mode's render pass.
  let HOLE_HANDICAP = COURSES[DEFAULT_HOME_COURSE].handicap;

  // Generic stroke allocation for an arbitrary list of players (used by Golf / Stroke Play modes)
  function gLowestIndex(players){
    return Math.min(...players.map(p=>Number(p.index)||0));
  }
  function gStrokesFor(players, pid){
    const p = players.find(x=>x.id===pid);
    if(!p) return 0;
    const diff = (Number(p.index)||0) - gLowestIndex(players);
    return Math.max(0, Math.floor(diff));
  }
  function gStrokeHoleNumbers(players, pid){
    const strokes = gStrokesFor(players, pid);
    if(strokes<=0) return [];
    const holes = [];
    for(let h=1; h<=18; h++){
      if(HOLE_HANDICAP[h] <= strokes) holes.push(h);
    }
    return holes.sort((a,b)=>a-b);
  }

  function emptyPointsHole(){
    return { scores:{}, categoryWinners:{} };
  }

  function getPointsHole(num){
    if(!pState.holes[num]) pState.holes[num] = emptyPointsHole();
    const ph = pState.holes[num];
    pState.players.forEach(p=>{
      if(ph.scores[p.id]===undefined || ph.scores[p.id]===null){ ph.scores[p.id] = PAR[num]; }
    });
    return ph;
  }

  function categoriesForHole(num){
    const cats = [];
    if(PAR[num]===3){ cats.push({key:"cpp", label:"Closest to Pin", icon:"\u26F3", auto:false}); }
    else { cats.push({key:"longdrive", label:"Long Drive", icon:"\u{1F3CC}", auto:false}); }
    cats.push({key:"lownet", label:"Low Net", icon:"\u2022", auto:true});
    (pState.extraCategories||[]).forEach((name,i)=>{
      cats.push({key:"extra"+i, label:name, icon:"\u2605", auto:false});
    });
    return cats;
  }

  function pointsLowNetWinner(num){
    const ph = pState.holes[num];
    if(!ph) return null;
    let best = null, bestIds = [];
    pState.players.forEach(p=>{
      const gross = ph.scores[p.id];
      if(gross===null || gross===undefined) return;
      const net = gross - (gStrokeHoleNumbers(pState.players, p.id).includes(num) ? 1 : 0);
      if(best===null || net<best){ best=net; bestIds=[p.id]; }
      else if(net===best){ bestIds.push(p.id); }
    });
    return bestIds.length===1 ? bestIds[0] : null;
  }

  // Replays every visited hole in order, applying carry-over rules per category
  function computePointsResults(){
    const totals = {}; pState.players.forEach(p=>totals[p.id]=0);
    const holeDeltas = {}; // holeNum -> {playerId: delta}
    const holeWinners = {}; // holeNum -> {catKey: playerId|null}
    const carryPot = {};

    for(let h=1; h<=18; h++){
      if(!pState.holes[h]) continue;
      const cats = categoriesForHole(h);
      holeDeltas[h] = {}; pState.players.forEach(p=>holeDeltas[h][p.id]=0);
      holeWinners[h] = {};
      cats.forEach(cat=>{
        if(carryPot[cat.key]===undefined) carryPot[cat.key]=0;
        const winnerId = cat.auto ? pointsLowNetWinner(h) : (pState.holes[h].categoryWinners[cat.key] || null);
        holeWinners[h][cat.key] = winnerId;
        const stake = pState.pointValue + carryPot[cat.key];
        if(winnerId){
          const others = pState.players.filter(p=>p.id!==winnerId);
          others.forEach(p=>{ holeDeltas[h][p.id] -= stake; totals[p.id] -= stake; });
          holeDeltas[h][winnerId] += stake*others.length;
          totals[winnerId] += stake*others.length;
          carryPot[cat.key] = 0;
        } else if(pState.carryOver){
          carryPot[cat.key] += pState.pointValue;
        }
      });
    }
    return { totals, holeDeltas, holeWinners, carryPot };
  }

  // ---- NASSAU (front 9 / back 9 / total 18, 2v2 teams) ----
  const NASSAU_KEY = "nassau-round-v1";

  const NASSAU_SEGMENTS = [
    {key:"front", label:"Front 9", holes:NASSAU_FRONT},
    {key:"back", label:"Back 9", holes:NASSAU_BACK},
    {key:"total", label:"Total 18", holes:NASSAU_ALL}

  function nTeamPlayers(team){ return nState.players.filter(p=>nState.teamOf[p.id]===team).map(p=>p.id); }
  function nOtherTeam(team){ return team==="A" ? "B" : "A"; }

  function nTeamsValid(){
    return nTeamPlayers("A").length===2 && nTeamPlayers("B").length===2;
  }

  function nPlayerValue(h, pid){
    const hole = nState.scores[h];
    if(!hole) return null;
    const gross = hole[pid];
    if(gross===null || gross===undefined) return null;
    if(!nState.useNet) return gross;
    const stroke = gStrokeHoleNumbers(nState.players, pid).includes(h) ? 1 : 0;
    return gross - stroke;
  }

  function nSegmentComplete(holes){
    return holes.every(h=>{
      const hole = nState.scores[h];
      if(!hole) return false;
      return nState.players.every(p=> hole[p.id]!==undefined && hole[p.id]!==null);
    });
  }

  function nTeamTotal(team, holes){
    let sum = 0;
    nTeamPlayers(team).forEach(pid=>{
      holes.forEach(h=>{
        const v = nPlayerValue(h, pid);
        if(v!==null) sum += v;
      });
    });
    return sum;
  }

  // Returns "A" | "B" | "tie" | null (null = not all holes in that segment are in yet)
  function nSegmentWinner(holes){
    if(!nSegmentComplete(holes)) return null;
    const totalA = nTeamTotal("A", holes);
    const totalB = nTeamTotal("B", holes);
    if(totalA<totalB) return "A";
    if(totalB<totalA) return "B";
    return "tie";
  }

  function computeNassauResults(){
    const totals = {}; nState.players.forEach(p=>totals[p.id]=0);
    const segmentResults = {};
    NASSAU_SEGMENTS.forEach(seg=>{
      const winner = nSegmentWinner(seg.holes);
      segmentResults[seg.key] = {
        winner,
        totalA: nTeamTotal("A", seg.holes),
        totalB: nTeamTotal("B", seg.holes)
      };
      if(winner && winner!=="tie"){
        const winners = nTeamPlayers(winner);
        const losers = nTeamPlayers(nOtherTeam(winner));
        winners.forEach(pid=>{ totals[pid] += nState.betAmount; });
        losers.forEach(pid=>{ totals[pid] -= nState.betAmount; });
      }
    });
    return { totals, segmentResults };
  }

  // ---- MATCH PLAY (1v1 singles, or 2v2 best-ball, hole-by-hole with handicap strokes) ----

      {id:"m1", name:"Player 1", index:0},
      {id:"m2", name:"Player 2", index:0},
      {id:"m3", name:"Player 3", index:0},
      {id:"m4", name:"Player 4", index:0}
    ];
    return {
      format: "1v1", // "1v1" (2 players, head to head) | "2v2" (4 players, 2 teams, best ball)
      players,
      teamOf: { m1:"A", m2:"B", m3:"A", m4:"B" },
      useNet: true,
      betAmount: 10,
      courseKey: homeCourse,
      tee: firstTeeKeyFor(homeCourse),
      currentHole: 1,
      setupDone: false,
      scores: {} // holeNum -> { playerId: grossScore }
    };
  }

  async function mSave(){
    try{ await window.storage.set(MATCH_KEY, JSON.stringify(mState), false); }
    catch(e){ console.error("match play save failed", e); }
  }
  async function mLoad(){
    try{
      const res = await window.storage.get(MATCH_KEY, false);
      if(res && res.value) return JSON.parse(res.value);
    }catch(e){ /* no key yet */ }
    return null;
  }

  // Players actually in the match: slots 0-1 for 1v1, all 4 for 2v2.
  function mActivePlayers(){
    return mState.format==="2v2" ? mState.players : mState.players.slice(0,2);
  }
  // 1v1 always pits slot 0 vs slot 1 as "A"/"B" - no team picker needed for 2 players.
  function mTeamOf(pid){
    if(mState.format!=="2v2"){
      return (mState.players[0] && mState.players[0].id===pid) ? "A" : "B";
    }
    return mState.teamOf[pid];
  }
  function mTeamPlayers(team){
    return mActivePlayers().filter(p=>mTeamOf(p.id)===team).map(p=>p.id);
  }
  function mOtherTeam(team){ return team==="A" ? "B" : "A"; }
  function mTeamsValid(){
    if(mState.format!=="2v2") return true;
    return mTeamPlayers("A").length===2 && mTeamPlayers("B").length===2;
  }
  function mTeamLabel(team){
    return mTeamPlayers(team).map(pid=>playerNameIn(mState.players, pid)).join(" & ");
  }

  // Singles match play allocates the full handicap difference. Four-ball best-ball
  // conventionally uses 90% of the difference from the lowest index in the group.
  // Like the rest of the app, "index" is used directly as the strokes basis (no
  // separate Course Handicap slope/rating conversion is modeled here).
  function mStrokePct(){ return mState.format==="2v2" ? 0.9 : 1; }
  function mStrokesFor(pid){
    const players = mActivePlayers();
    const p = players.find(x=>x.id===pid);
    if(!p) return 0;
    const lowest = Math.min(...players.map(x=>Number(x.index)||0));
    const diff = (Number(p.index)||0) - lowest;
    return Math.max(0, Math.floor(diff * mStrokePct()));
  }
  function mStrokeHoleNumbers(pid){
    const strokes = mStrokesFor(pid);
    if(strokes<=0) return [];
    const holes = [];
    for(let h=1; h<=18; h++){ if(HOLE_HANDICAP[h] <= strokes) holes.push(h); }
    return holes.sort((a,b)=>a-b);
  }

  function mNetValue(h, pid){
    const hole = mState.scores[h];
    if(!hole) return null;
    const gross = hole[pid];
    if(gross===null || gross===undefined) return null;
    if(!mState.useNet) return gross;
    const stroke = mStrokeHoleNumbers(pid).includes(h) ? 1 : 0;
    return gross - stroke;
  }
  // Best (lowest) net score on a hole among a team's player(s) - the "best ball".
  // For 1v1, a team has exactly one player, so this is just that player's net score.
  function mTeamBest(h, team){
    const vals = mTeamPlayers(team).map(pid=>mNetValue(h,pid)).filter(v=>v!==null);
    if(vals.length===0) return null;
    return Math.min(...vals);
  }
  function mHoleRecorded(h){
    const hole = mState.scores[h];
    if(!hole) return false;
    return mActivePlayers().every(p=> hole[p.id]!==undefined && hole[p.id]!==null);
  }
  // "A" | "B" | "halve" | null (null = hole not yet fully scored)
  function mHoleWinner(h){
    if(!mHoleRecorded(h)) return null;
    const a = mTeamBest(h,"A"), b = mTeamBest(h,"B");
    if(a===null || b===null) return null;
    if(a<b) return "A";
    if(b<a) return "B";
    return "halve";
  }

  // Walks holes 1-18 in order (stopping at the first hole not yet fully scored) and
  // tracks the running "up" count, detecting the point (if any) where the match is
  // mathematically decided - i.e. the leader's up count exceeds the holes remaining.
  function computeMatchStatus(){
    let diff = 0, holesPlayed = 0, clinchedAt = null;
    for(let h=1; h<=18; h++){
      if(!mHoleRecorded(h)) break;
      holesPlayed = h;
      const w = mHoleWinner(h);
      if(w==="A") diff += 1;
      else if(w==="B") diff -= 1;
      const remaining = 18 - h;
      if(clinchedAt===null && Math.abs(diff) > remaining){
        clinchedAt = { hole:h, diff, remaining };
      }
    }
    return { diff, holesPlayed, clinchedAt };
  }

  // Human-readable match state, e.g. "All square thru 6", "Team A 2 up thru 14 (dormie)",
  // "Team B wins 3 & 2". Also flags whether/who won, for money settlement.
  function matchStatusText(){
    const s = computeMatchStatus();
    const teamName = (t)=> mState.format==="2v2" ? ("Team "+t) : playerNameIn(mState.players, mTeamPlayers(t)[0]);
    if(s.clinchedAt){
      const leader = s.clinchedAt.diff>0 ? "A" : "B";
      const upBy = Math.abs(s.clinchedAt.diff);
      return { done:true, halved:false, winner:leader,
        text: teamName(leader)+" wins "+upBy+" & "+s.clinchedAt.remaining };
    }
    if(s.holesPlayed===18){
      if(s.diff===0) return { done:true, halved:true, winner:null, text:"Match halved \u2014 all square thru 18" };
      const leader = s.diff>0 ? "A" : "B";
      return { done:true, halved:false, winner:leader, text: teamName(leader)+" wins "+Math.abs(s.diff)+" up" };
    }
    if(s.holesPlayed===0) return { done:false, halved:false, winner:null, text:"Not started" };
    const remaining = 18 - s.holesPlayed;
    if(s.diff===0) return { done:false, halved:false, winner:null, text:"All square thru "+s.holesPlayed };
    const leader = s.diff>0 ? "A" : "B";
    const upBy = Math.abs(s.diff);
    const dormie = upBy===remaining;
    return { done:false, halved:false, winner:null,
      text: teamName(leader)+" "+upBy+" up thru "+s.holesPlayed + (dormie ? " (dormie)" : "") };
  }

  function computeMatchResults(){
    const info = matchStatusText();
    const totals = {}; mActivePlayers().forEach(p=>totals[p.id]=0);
    if(info.done && !info.halved && info.winner){
      const winners = mTeamPlayers(info.winner), losers = mTeamPlayers(mOtherTeam(info.winner));
      winners.forEach(pid=>{ totals[pid] += mState.betAmount; });
      losers.forEach(pid=>{ totals[pid] -= mState.betAmount; });
    }
    return { info, totals };
  }

  // ---- DEMO SIMULATION (random scores, birdie to double bogey) ----
  function simulateHawkRound(){

  const el = (tag, cls, html) => {
    const e = document.createElement(tag);
    if(cls) e.className = cls;
    if(html !== undefined) e.innerHTML = html;
    return e;
  };
  const app = document.getElementById("app");

  function defaultState(){
    return {
      players: [
        {id:"p1", name:"Player 1", index:0},
        {id:"p2", name:"Player 2", index:0},
        {id:"p3", name:"Player 3", index:0},
        {id:"p4", name:"Player 4", index:0},
        {id:"p5", name:"Player 5", index:0},
      ],
      courseKey: homeCourse,
      order: [],
      currentHole: 1,
      setupDone: false,
      holes: {}
    };
  }

  function emptyHole(num){
    return {
      num,
      hawkId: null,
      hawkManual: false,
      mode: "team", // team | alone | dump
      partnerId: null,
      baseBet: isHawkHole(num) ? 6 : 2,
      manualDoubles: 0,
      birdie: false,
      birdieManual: false,
      winner: null, // "A" | "B" | "tie"
      winnerManual: false,
      concededBy: null, // "A" | "B" | null
      locked: false,
      deltas: null,
      scores: {} // playerId -> gross score (optional, record-keeping only)
    };
  }

  function isSoloMode(mode){ return mode==="alone" || mode==="dump"; }

  function effectiveBet(hs){
    const solo = isSoloMode(hs.mode) ? 2 : 1;
    const birdieMult = hs.birdie ? 2 : 1;
    return (Number(hs.baseBet)||0) * solo * birdieMult * Math.pow(2, hs.manualDoubles||0);
  }

  async function save(){
    try{ await window.storage.set(STORAGE_KEY, JSON.stringify(state), false); }
    catch(e){ console.error("save failed", e); }
  }

  async function load(){
    try{
      const res = await window.storage.get(STORAGE_KEY, false);
      if(res && res.value){ state = JSON.parse(res.value); return true; }
    }catch(e){ /* no key yet */ }
    return false;
  }

  async function saveRoster(){
    try{ await window.storage.set(ROSTER_KEY, JSON.stringify(savedPlayers), false); }
    catch(e){ console.error("roster save failed", e); }
  }

  async function loadRoster(){
    try{
      const res = await window.storage.get(ROSTER_KEY, false);
      if(res && res.value){ return JSON.parse(res.value); }
    }catch(e){ /* no roster saved yet */ }
    return [];
  }

  function upsertRosterPlayer(name, index){
    if(!name) return;
    const i = savedPlayers.findIndex(sp=>sp.name.toLowerCase()===name.toLowerCase());
    if(i>=0) savedPlayers[i] = {name, index};
    else savedPlayers.push({name, index});
    saveRoster();
  }

  function removeRosterPlayer(name){
    savedPlayers = savedPlayers.filter(sp=>sp.name!==name);
    saveRoster();
  }

  function playerName(pid){
    const p = state.players.find(x=>x.id===pid);
    return p ? p.name : "?";
  }

  function lowestIndex(){
    return Math.min(...state.players.map(p=>Number(p.index)||0));
  }

  function strokesFor(pid){
    const p = state.players.find(x=>x.id===pid);
    if(!p) return 0;
    const diff = (Number(p.index)||0) - lowestIndex();
    return Math.max(0, Math.floor(diff));
  }

  function isHawkHole(num){ return num >= HAWK_HOLE_START; }

  function cumulativeTotals(uptoHoleExclusive){
    const totals = {};
    state.players.forEach(p=>totals[p.id]=0);
    for(let h=1; h<uptoHoleExclusive; h++){
      const hs = state.holes[h];
      if(hs && hs.locked && hs.deltas){
        state.players.forEach(p=>{ totals[p.id] += (hs.deltas[p.id]||0); });
      }
    }
    return totals;
  }

  function suggestHawk(num){
    if(!isHawkHole(num)){
      const idx = (num-1) % state.order.length;
      return state.order[idx];
    }else{
      const totals = cumulativeTotals(num);
      let worst=null, worstVal=Infinity;
      state.order.forEach(pid=>{
        if(totals[pid] < worstVal){ worstVal=totals[pid]; worst=pid; }
      });
      return worst;
    }
  }

  function getHole(num){
    if(!state.holes[num]) state.holes[num] = emptyHole(num);
    const hs = state.holes[num];
    if(hs.baseBet===undefined){ hs.baseBet = (hs.bet!==undefined ? hs.bet : (isHawkHole(num)?6:2)); }
    if(hs.manualDoubles===undefined){ hs.manualDoubles = 0; }
    if(hs.birdie===undefined){ hs.birdie = false; }
    if(hs.birdieManual===undefined){ hs.birdieManual = false; }
    if(hs.winnerManual===undefined){ hs.winnerManual = !!hs.winner || !!hs.concededBy; }
    if(!hs.scores){ hs.scores = {}; }
    if(!hs.hawkId && !hs.hawkManual) hs.hawkId = suggestHawk(num);
    return hs;
  }

  // Groups A (hawk side) and B (other side) for a hole
  function groupsFor(hs){
    const all = state.players.map(p=>p.id);
    if(hs.mode === "alone"){
      return { A:[hs.hawkId], B: all.filter(id=>id!==hs.hawkId) };
    }
    if(hs.mode === "dump"){
      const solo = hs.partnerId;
      return { A:[solo], B: all.filter(id=>id!==solo) };
    }
    const A = [hs.hawkId, hs.partnerId].filter(Boolean);
    const B = all.filter(id=>!A.includes(id));
    return {A,B};
  }

  function modeLabelFor(hs){
    if(hs.mode==="team") return "Hawk: "+playerName(hs.hawkId)+(hs.partnerId?(" + "+playerName(hs.partnerId)):" (no partner picked)");
    if(hs.mode==="alone") return "Hawk: "+playerName(hs.hawkId)+" (alone)";
    return "Dump: "+(hs.partnerId?playerName(hs.partnerId):"?")+" solo";
  }

  function winnerLabel(hs){
    const {A,B} = groupsFor(hs);
    const aLabel = hs.mode==="team" ? A.map(playerName).join(" + ") : playerName(A[0])+" (solo)";
    const bLabel = B.map(playerName).join(", ");
    if(hs.winner==="tie") return "Tie \u2014 no money";
    if(!hs.winner) return "Not yet decided";
    const winSide = hs.winner==="A" ? aLabel : bLabel;
    return winSide+" won"+(hs.concededBy?" (conceded)":"");
  }

  // Best (lowest) net score within a group of players for a given hole, or null if nobody has a score yet
  function bestNetInGroup(hs, ids){
    let best = null;
    ids.forEach(id=>{
      const gross = hs.scores ? hs.scores[id] : null;
      if(gross===null || gross===undefined) return;
      const net = gross - (strokeHoleNumbers(id).includes(hs.num) ? 1 : 0);
      if(best===null || net<best) best = net;
    });
    return best;
  }

  // Suggests a winner ("A"|"B"|"tie") from best-ball net scores, or null if there's not enough data yet
  function suggestWinner(hs){
    const {A,B} = groupsFor(hs);
    const bestA = bestNetInGroup(hs, A);
    const bestB = bestNetInGroup(hs, B);
    if(bestA===null || bestB===null) return null;
    if(bestA<bestB) return "A";
    if(bestB<bestA) return "B";
    return "tie";
  }

  // Auto-doubles the bet if anyone on the winning side made a birdie or better
  function detectBirdie(hs){
    const {A,B} = groupsFor(hs);
    const winningGroup = hs.winner==="A" ? A : (hs.winner==="B" ? B : null);
    if(!winningGroup) return false;
    return winningGroup.some(id=>{
      const gross = hs.scores ? hs.scores[id] : null;
      if(gross===null || gross===undefined) return false;
      return (gross - PAR[hs.num]) <= -1;
    });
  }

  function computeDeltas(hs){
    const {A,B} = groupsFor(hs);
    const bet = effectiveBet(hs);
    const deltas = {};
    state.players.forEach(p=>deltas[p.id]=0);
    if(hs.winner==="tie" || !hs.winner) return deltas;
    // Pool is always the bet times the size of "the other side" (B) -
    // this is the side the bet's dollar amount is defined per-person for,
    // regardless of which side actually wins or loses the hole.
    const pool = bet * B.length;
    const winners = hs.winner==="A" ? A : B;
    const losers = hs.winner==="A" ? B : A;
    const winAmt = Math.round(pool / winners.length);
    const loseAmt = Math.round(pool / losers.length);
    winners.forEach(id=>{ deltas[id] += winAmt; });
    losers.forEach(id=>{ deltas[id] -= loseAmt; });
    return deltas;
  }

  function fmtMoney(amt){
    const rounded = Math.round(amt*100)/100;
    const cls = rounded>0?"pos":(rounded<0?"neg":"zero");
    const text = (rounded>0?"+":rounded<0?"-":"") + "$" + Math.abs(rounded).toFixed(2).replace(/\.00$/,"");
    return {cls,text};
  }

  function enableOrderDrag(container){
    const GAP = 8; // matches .order-list { gap: 8px }
    let dragging = null, startClientY = 0, pointerId = null;

    function updateNums(){
      Array.from(container.querySelectorAll(".order-row")).forEach((row,i)=>{
        const numEl = row.querySelector(".num");
        if(numEl) numEl.textContent = String(i+1);
      });
    }

    function onPointerMove(e){
      if(!dragging) return;
      const dy = e.clientY - startClientY;
      dragging.style.transform = "translateY("+dy+"px)";
      const rows = Array.from(container.querySelectorAll(".order-row"));
      const idx = rows.indexOf(dragging);
      const dRect = dragging.getBoundingClientRect();
      const centerY = dRect.top + dRect.height/2;

      const next = rows[idx+1];
      if(next){
        const nRect = next.getBoundingClientRect();
        if(centerY > nRect.top + nRect.height/2){
          container.insertBefore(dragging, next.nextSibling);
          startClientY += (nRect.height + GAP);
          updateNums();
          return;
        }
      }
      const prev = rows[idx-1];
      if(prev){
        const pRect = prev.getBoundingClientRect();
        if(centerY < pRect.top + pRect.height/2){
          container.insertBefore(dragging, prev);
          startClientY -= (pRect.height + GAP);
          updateNums();
        }
      }
    }

    function onPointerUp(){
      if(!dragging) return;
      dragging.style.transform = "";
      dragging.classList.remove("dragging");
      dragging.style.zIndex = "";
      document.body.style.userSelect = "";
      document.removeEventListener("pointermove", onPointerMove);
      document.removeEventListener("pointerup", onPointerUp);
      const rows = Array.from(container.querySelectorAll(".order-row"));
      state.order = rows.map(r=>r.dataset.pid);
      dragging = null; pointerId = null;
      save(); render();
    }

    container.querySelectorAll(".drag-handle").forEach(handle=>{
      handle.addEventListener("pointerdown", (e)=>{
        e.preventDefault();
        const row = handle.closest(".order-row");
        dragging = row;
        startClientY = e.clientY;
        pointerId = e.pointerId;
        row.classList.add("dragging");
        row.style.zIndex = "5";
        document.body.style.userSelect = "none";
        try{ handle.setPointerCapture(pointerId); }catch(err){ /* not critical */ }
        document.addEventListener("pointermove", onPointerMove);
        document.addEventListener("pointerup", onPointerUp);
      });
    });
  }

  // ---- PLAY ----
  function renderPlay(){
    const wrap = el("div");
    const num = state.currentHole;
    const hs = getHole(num);
    const hawkHole = isHawkHole(num);

    const head = el("div","card");
    const hh = el("div","hole-head");
    const left = el("div");

    left.appendChild(el("div","hole-meta", hawkHole?"Hawk Hole":"Regular Hole"));

    if(hawkHole) right.appendChild(el("div","hawk-hole-flag","Hawk Hole"));
    hh.appendChild(right);
    head.appendChild(hh);

    const hawkRow = el("div");
    hawkRow.style.marginBottom="12px";
    hawkRow.appendChild(el("label",null,"Hawk"));
    const hawkSel = el("select");
    state.order.forEach(pid=>{
      const o = el("option",null,playerName(pid)); o.value=pid;
      if(hs.hawkId===pid) o.selected=true;
      hawkSel.appendChild(o);
    });
    hawkSel.disabled = hs.locked;
    hawkSel.onchange = ()=>{
      hs.hawkId = hawkSel.value; hs.hawkManual = true;
      if(hs.partnerId===hs.hawkId) hs.partnerId=null;
      save(); render();
    };
    hawkRow.appendChild(hawkSel);
    if(hawkHole) hawkRow.appendChild(el("div","helptext","Suggested: currently down the most money. Change if needed."));
    head.appendChild(hawkRow);
    wrap.appendChild(head);

    // Teams
    const teamCard = el("div","card");
    teamCard.appendChild(el("h2","section-title","Teams"));
    const modeRow = el("div","btn-row");
    [["team","Pick a Partner"],["alone","Hawk Goes Alone"],["dump","Partner Dumps"]].forEach(([m,label])=>{
      const b = el("button","btn "+(hs.mode===m?"":"secondary"),label);
      b.disabled = hs.locked;
      b.onclick = ()=>{ hs.mode=m; if(m==="alone") hs.partnerId=null; save(); render(); };
      modeRow.appendChild(b);
    });
    teamCard.appendChild(modeRow);

    if(hs.mode==="team" || hs.mode==="dump"){
      const label = hs.mode==="dump" ? "Who was picked, then dumped?" : "Partner";
      teamCard.appendChild(el("label",null,label));
      const chips = el("div","row");
      state.players.filter(p=>p.id!==hs.hawkId).forEach(p=>{
        const chip = el("div","player-chip"+(hs.partnerId===p.id?" selected":""));
        chip.appendChild(el("div","dot"));
        chip.appendChild(el("div",null,p.name));
        if(!hs.locked) chip.onclick = ()=>{ hs.partnerId=p.id; save(); render(); };
        chips.appendChild(chip);
      });
      teamCard.appendChild(chips);
      if(hs.mode==="dump"){
        teamCard.appendChild(el("div","note","The dumping partner plays alone against the Hawk and the remaining players."));
      }
    } else {
      teamCard.appendChild(el("div","note","Hawk plays alone against the other four."));
    }
    wrap.appendChild(teamCard);

    const needsPartner = (hs.mode==="team"||hs.mode==="dump") && !hs.partnerId;
    const {A,B} = groupsFor(hs);

    // Default every player's score to par for this hole until they override it
    if(!hs.scores) hs.scores = {};
    if(!hs.locked){
      state.players.forEach(p=>{
        if(hs.scores[p.id]===undefined || hs.scores[p.id]===null){ hs.scores[p.id] = PAR[num]; }
      });
    }

    // Auto-suggest the winner from best-ball net scores, unless the user has manually chosen one
    if(!needsPartner && !hs.locked && !hs.winnerManual){
      const suggestion = suggestWinner(hs);
      if(suggestion){ hs.winner = suggestion; }
    }
    // Auto-double the bet on a birdie by the winning side, unless manually toggled
    if(!needsPartner && !hs.locked && !hs.birdieManual){
      hs.birdie = detectBirdie(hs);
    }

    // Bet
    const betCard = el("div","card");
    betCard.appendChild(el("h2","section-title","Bet"));

    const bet = effectiveBet(hs);
    const heroWrap = el("div","bet-hero");
    heroWrap.appendChild(el("div","bet-hero-label","Current Bet In Play"));
    heroWrap.appendChild(el("div","bet-hero-amount","$"+bet));
    betCard.appendChild(heroWrap);

    const notes = [];
    if(isSoloMode(hs.mode)) notes.push("doubled because it's a solo hole (Hawk alone or a dump)");
    if(hs.birdie) notes.push("doubled because the winning team birdied");
    if(hs.manualDoubles>0) notes.push("doubled "+hs.manualDoubles+"x more from the double-bet button");
    if(notes.length) betCard.appendChild(el("div","note","Bet is "+notes.join("; ")+"."));

    const betRow = el("div","row");
    const betWrap = el("div");
    betWrap.appendChild(el("label",null,"Starting bet ($)"));
    const betInput = el("input"); betInput.id="base-bet-input"; betInput.type="number"; betInput.min=0; betInput.step="1"; betInput.value=hs.baseBet;
    betInput.disabled = hs.locked;
    betInput.oninput = ()=>{ hs.baseBet = betInput.value===""?0:Math.round(Number(betInput.value)); save(); render(); };
    betWrap.appendChild(betInput);
    betRow.appendChild(betWrap);
    betCard.appendChild(betRow);

    const modRow = el("div","btn-row");
    const dblBtn = el("button","btn secondary","Double Bet (\u2192 $"+(bet*2)+")");
    dblBtn.disabled = hs.locked;
    dblBtn.onclick = ()=>{ hs.manualDoubles = (hs.manualDoubles||0)+1; save(); render(); };
    const birdieBtn = el("button","btn "+(hs.birdie?"":"secondary"),"\u{1F426} Birdie (doubles bet)");
    birdieBtn.disabled = hs.locked;
    birdieBtn.onclick = ()=>{ hs.birdie = !hs.birdie; hs.birdieManual = true; save(); render(); };
    modRow.appendChild(dblBtn); modRow.appendChild(birdieBtn);
    betCard.appendChild(modRow);
    if(!hs.birdieManual){
      betCard.appendChild(el("div","note","Birdie is auto-detected from the winning side's scores. Tap the button to override it manually."));
    } else if(!hs.locked){
      const autoBirdieBtn = el("button","btn ghost","\u21BA Back to auto-detect");
      autoBirdieBtn.style.marginTop="6px";
      autoBirdieBtn.onclick = ()=>{ hs.birdieManual=false; save(); render(); };
      betCard.appendChild(autoBirdieBtn);
    }

    const resetRow = el("div","btn-row");
    const resetDefault = hawkHole ? 6 : 2;
    const resetBetBtn = el("button","btn ghost","Reset to $"+resetDefault);
    resetBetBtn.disabled = hs.locked;
    resetBetBtn.onclick = ()=>{ hs.baseBet=resetDefault; hs.manualDoubles=0; hs.birdie=false; hs.birdieManual=false; save(); render(); };
    resetRow.appendChild(resetBetBtn);
    betCard.appendChild(resetRow);
    wrap.appendChild(betCard);

    // Scorecard (strokes reference + score entry)
    const strokeCard = el("div","card");
    strokeCard.appendChild(el("h2","section-title","Scorecard"));
    strokeCard.appendChild(el("div","note","Par "+PAR[num]+" is filled in by default \u2014 tap a shape or type a score to override. Recording scores here also suggests the winner and birdie double above, which you can still adjust."));
    state.players.forEach(p=>{
      const block = el("div","score-entry-block");
      const top = el("div","score-entry-top");
      let tag;
      if(needsPartner){ tag = '<span class="team-tag other">\u2014</span>'; }
      else if(hs.mode==="team"){
        tag = A.includes(p.id) ? '<span class="team-tag hawk">Hawk</span>' : '<span class="team-tag other">Other</span>';
      } else {
        tag = A.includes(p.id) ? '<span class="team-tag solo">Solo</span>' : '<span class="team-tag other">Vs</span>';
      }
      const getsStroke = strokeHoleNumbers(p.id).includes(num);
      const left = el("div");
      left.innerHTML = '<span class="score-entry-name">'+p.name+'</span> '+tag;
      top.appendChild(left);
      const gross = hs.scores[p.id];
      const net = (gross===null||gross===undefined) ? null : gross-(getsStroke?1:0);
      top.appendChild(el("div","score-entry-meta", (getsStroke?"Stroke here \u00b7 ":"")+(net===null?"No score yet":"Net "+net)));
      block.appendChild(top);

      if(!hs.locked){
        block.appendChild(buildScoreButtonRow(PAR[num], gross, (value)=>{
          hs.scores[p.id] = value;
          save(); render();
        }, "hawk-score-"+num+"-"+p.id));
      }
      strokeCard.appendChild(block);
    });
    wrap.appendChild(strokeCard);

    // Winner + result
    const resultCard = el("div","card");
    resultCard.appendChild(el("h2","section-title","Winner"));
    if(needsPartner){
      resultCard.appendChild(el("div","note","Choose a partner (or dumped player) above first."));
    } else {
      const aLabel = hs.mode==="team" ? A.map(playerName).join(" + ") : playerName(A[0])+" (solo)";
      const bLabel = B.map(playerName).join(", ");
      const winRow = el("div","btn-row");
      const aBtn = el("button","btn secondary winner-btn"+(hs.winner==="A"&&!hs.concededBy?" chosen":""), aLabel+" wins");
      aBtn.disabled = hs.locked;
      aBtn.onclick = ()=>{ hs.winner="A"; hs.winnerManual=true; hs.concededBy=null; save(); render(); };
      const bBtn = el("button","btn secondary winner-btn"+(hs.winner==="B"&&!hs.concededBy?" chosen":""), bLabel+" wins");
      bBtn.disabled = hs.locked;
      bBtn.onclick = ()=>{ hs.winner="B"; hs.winnerManual=true; hs.concededBy=null; save(); render(); };
      const tieBtn = el("button","btn ghost winner-btn"+(hs.winner==="tie"?" chosen":""), "Tie \u2014 no money");
      tieBtn.disabled = hs.locked;
      tieBtn.onclick = ()=>{ hs.winner="tie"; hs.winnerManual=true; hs.concededBy=null; save(); render(); };
      winRow.appendChild(aBtn); winRow.appendChild(bBtn); winRow.appendChild(tieBtn);
      resultCard.appendChild(winRow);

      if(!hs.winnerManual && hs.winner){
        resultCard.appendChild(el("div","note","Suggested automatically from best-ball net scores \u2014 tap a button above to override."));
      } else if(hs.winnerManual && !hs.locked){
        const autoWinnerBtn = el("button","btn ghost","\u21BA Back to auto-suggest");
        autoWinnerBtn.style.marginTop="4px";
        autoWinnerBtn.onclick = ()=>{ hs.winnerManual=false; hs.concededBy=null; save(); render(); };
        resultCard.appendChild(autoWinnerBtn);
      }

      const concedeRow = el("div","btn-row");
      const aConcedeBtn = el("button","btn ghost winner-btn"+(hs.concededBy==="A"?" chosen":""), aLabel+" concedes");
      aConcedeBtn.disabled = hs.locked;
      aConcedeBtn.onclick = ()=>{ hs.winner="B"; hs.winnerManual=true; hs.concededBy="A"; save(); render(); };
      const bConcedeBtn = el("button","btn ghost winner-btn"+(hs.concededBy==="B"?" chosen":""), bLabel+" concedes");
      bConcedeBtn.disabled = hs.locked;
      bConcedeBtn.onclick = ()=>{ hs.winner="A"; hs.winnerManual=true; hs.concededBy="B"; save(); render(); };
      concedeRow.appendChild(aConcedeBtn); concedeRow.appendChild(bConcedeBtn);
      resultCard.appendChild(concedeRow);

      if(hs.concededBy){
        const whoConceded = hs.concededBy==="A" ? aLabel : bLabel;
        resultCard.appendChild(el("div","note","\u26A9 "+whoConceded+" conceded the hole \u2014 the bet is paid regardless of score."));
      }

      if(hs.winner){
        const deltas = computeDeltas(hs);
        const results = el("div"); results.style.marginTop="14px";
        state.players.forEach(p=>{
          const row = el("div","summary-row");
          row.appendChild(el("div",null,p.name));
          const {cls,text} = fmtMoney(deltas[p.id]);
          row.appendChild(el("div","money "+cls, text));
          results.appendChild(row);
        });
        resultCard.appendChild(results);

        if(!hs.locked){
          const confirmBtn = el("button","btn","Confirm Hole "+num);
          confirmBtn.style.marginTop="12px";
          confirmBtn.onclick = ()=>{
            hs.locked = true;
            hs.deltas = deltas;
            if(num < HOLES_COUNT) state.currentHole = num+1;
            save(); render();
          };
          resultCard.appendChild(confirmBtn);
        } else {
          resultCard.appendChild(el("div","note","\u2713 Hole locked in."));
          const editBtn = el("button","btn secondary","Edit this hole");
          editBtn.style.marginTop="8px";
          editBtn.onclick = ()=>{ hs.locked=false; save(); render(); };
          resultCard.appendChild(editBtn);
        }
      }
    }
    wrap.appendChild(resultCard);

    const navRow = el("div","btn-row");
    if(num>1){
      const prevBtn = el("button","btn secondary","\u2190 Hole "+(num-1));
      prevBtn.onclick = ()=>{ state.currentHole=num-1; save(); render(); };
      navRow.appendChild(prevBtn);
    }
    if(hs.locked && num<HOLES_COUNT){
      const nextBtn = el("button","btn secondary","Hole "+(num+1)+" \u2192");
      nextBtn.onclick = ()=>{ state.currentHole=num+1; save(); render(); };
      navRow.appendChild(nextBtn);
    }
    if(hs.locked && num===HOLES_COUNT){
      const finishBtn = el("button","btn","See Round Summary");
      finishBtn.onclick = ()=>{ view="summary"; render(); };
      navRow.appendChild(finishBtn);
    }
    wrap.appendChild(navRow);

    return wrap;
  }

  // ---- SUMMARY ----
  function buildSummaryText(){
    const lines = [];
    lines.push("HAWK \u2014 Round Summary");
    lines.push("");
    lines.push("Final Money Standings:");
    const totals = cumulativeTotals(HOLES_COUNT+1);
    const ranked = state.players.slice().sort((a,b)=>totals[b.id]-totals[a.id]);
    ranked.forEach((p,i)=>{
      const amt = totals[p.id];
      lines.push((i+1)+". "+p.name+": "+(amt>0?"+":"")+"$"+amt);
    });
    lines.push("");
    lines.push("Hole-by-Hole:");
    const holeNums = Object.keys(state.holes).map(Number).sort((a,b)=>a-b).filter(n=>state.holes[n].locked);
    if(holeNums.length===0){
      lines.push("No holes completed yet.");
    } else {
      holeNums.forEach(num=>{
        const hs = state.holes[num];
        lines.push("Hole "+num+(isHawkHole(num)?" (Hawk Hole)":"")+" \u2014 "+modeLabelFor(hs)+" \u2014 Bet $"+effectiveBet(hs)+" \u2014 "+winnerLabel(hs));
        const deltaLine = state.players.map(p=>{
          const d = hs.deltas ? (hs.deltas[p.id]||0) : 0;
          return p.name+" "+(d>0?"+":"")+"$"+d;
        }).join(", ");
        lines.push("   "+deltaLine);
      });
    }
    return lines.join("\n");
  }

    textarea.style.marginTop = "8px";
    textarea.value = buildSummaryText();
    shareCard.appendChild(textarea);

    const copyBtn = el("button","btn","Copy to Clipboard");
    copyBtn.style.marginTop = "10px";
    copyBtn.onclick = async ()=>{
      textarea.select();
      try{
        await navigator.clipboard.writeText(textarea.value);
        copyBtn.textContent = "Copied!";
      }catch(e){
        try{
          document.execCommand("copy");

  function renderRules(){
    const wrap = el("div");

    wrap.appendChild(ruleSection("Overview", [

    ]));

    wrap.appendChild(ruleSection("Playing Order &amp; The Hawk", [
      "Before Hole 1, the group sets a tee order (the ball-toss order). Player 1 in that order is the Hawk on Hole 1, Player 2 on Hole 2, and so on \u2014 the rotation repeats through Hole 15.",
      "On Holes 16, 17 and 18, the rotation stops: the Hawk is automatically whoever is down the most money at that point (you can always override the suggestion if there's a tie or dispute)."
    ]));

    wrap.appendChild(ruleSection("Teams", [
      "On each hole the Hawk either picks a partner, goes alone, or gets dumped:",
      "\u2022 Pick a Partner \u2014 the Hawk and partner play as a 2-player team against the other 3.",
      "\u2022 Hawk Goes Alone \u2014 the Hawk didn't pick a partner before leaving the tee box, so the Hawk plays solo against all 4 other players.",
      "\u2022 Partner Dumps \u2014 the picked partner declines the Hawk's invitation. The dumping partner now plays solo against the other four, which includes the Hawk."
    ]));

    wrap.appendChild(ruleSection("Handicaps &amp; Strokes", [
      "Each player's strokes are their handicap index minus the lowest index in the group, rounded down. The lowest-index player always plays with 0 strokes.",
      "Those strokes fall on the hardest holes first, based on the selected course's hole ratings (rank 1 = hardest). A 3-stroke player gets a shot on whichever three holes are rated 1, 2 and 3.",
      "The app shows exactly which holes each player gets a stroke on on Setup, and flags it hole-by-hole during Play."
    ]));

    wrap.appendChild(ruleSection("The Bet", [
      "The starting bet is $2 per hole, except Holes 16\u201318 which start at $6.",

      "The bet also doubles any time the winning team makes a birdie \u2014 tap the \u{1F426} Birdie button to apply it.",
      "Either side can double the bet further at any point using the Double Bet button \u2014 it can stack more than once on a hole if the group keeps upping the stakes.",
      "If one side would rather pay up than take a double, they can concede the hole instead \u2014 the other side wins the bet regardless of the score."
    ]));

    wrap.appendChild(ruleSection("Deciding the Winner &amp; Payout Math", [
      "Once scores are compared for the hole, mark which side won, tie it (no money changes hands), or record a concession.",

      "Example: bet is $2, the Hawk's 2-player team loses to the other 3 \u2014 the Hawk team pays $6 total ($2 \u00d7 3), split $3 each; the 3 winners split that $6, or $2 each.",
      "Example: bet is $8, the Hawk's 2-player team wins \u2014 pool is still based on the 3-person side ($8 \u00d7 3 = $24): the losers pay $8 each, the 2 winners split $24, or $12 each."

    const scoreCard = el("div","card");
    scoreCard.appendChild(el("h2","section-title","Scores"));
    scoreCard.appendChild(el("div","note","Par "+PAR[num]+" is filled in by default \u2014 tap a shape or type a score to override."));
    gState.players.forEach(p=>{
      const block = el("div","score-entry-block");
      const top = el("div","score-entry-top");
      const getsStroke = isStroke && gStrokeHoleNumbers(gState.players,p.id).includes(num);
      top.appendChild(el("div","score-entry-name",p.name));
      const gross = gState.scores[num][p.id];
      if(isStroke){
        const net = (gross===null||gross===undefined) ? null : gross-(getsStroke?1:0);
        top.appendChild(el("div","score-entry-meta", (getsStroke?"Stroke here \u00b7 ":"")+(net===null?"No score yet":"Net "+net)));
      }
      block.appendChild(top);
      block.appendChild(buildScoreButtonRow(PAR[num], gross, (value)=>{
        gState.scores[num][p.id] = value;
        gSave(); render();
      }, "g-score-"+num+"-"+p.id));
      scoreCard.appendChild(block);
    });
    wrap.appendChild(scoreCard);

    const totalsCard = el("div","card");
    totalsCard.appendChild(el("h2","section-title","Running Totals (thru "+num+")"));
    const totTable = el("table","ref-table");
    const totHead = el("tr");
    const totCols = isStroke ? ["Player","Gross","To Par","Net","Net To Par"] : ["Player","Gross","To Par"];
    totCols.forEach(t=>totHead.appendChild(el("th",null,t)));
    totTable.appendChild(totHead);
    gState.players.forEach(p=>{
      let grossTotal=0, netTotal=0, parSoFar=0;
      for(let h=1; h<=num; h++){
        const g = gState.scores[h] ? gState.scores[h][p.id] : null;
        if(g!==null && g!==undefined){
          grossTotal += g; parSoFar += PAR[h];
          if(isStroke) netTotal += g - (gStrokeHoleNumbers(gState.players,p.id).includes(h)?1:0);
        }
      }
      const toPar = grossTotal - parSoFar;
      const toParStr = toPar===0?"E":(toPar>0?"+"+toPar:String(toPar));
      const tr = el("tr");
      tr.appendChild(el("td",null,p.name));
      tr.appendChild(el("td",null,String(grossTotal)));
      tr.appendChild(el("td",null,toParStr));
      if(isStroke){
        const netToPar = netTotal - parSoFar;
        const netToParStr = netToPar===0?"E":(netToPar>0?"+"+netToPar:String(netToPar));
        tr.appendChild(el("td",null,String(netTotal)));
        tr.appendChild(el("td",null,netToParStr));
      }
      totTable.appendChild(tr);
    });

      finishBtn.onclick = ()=>{ view="g-summary"; render(); };
      navRow.appendChild(finishBtn);
    }
    wrap.appendChild(navRow);
    return wrap;
  }

  // ---- GOLF / STROKE PLAY: summary ----
  function buildGSummaryText(){
    const isStroke = !!gState.useNet;
    const allHoles = [...Array(18)].map((_,i)=>i+1);
    const lines = [];
    lines.push((isStroke?"STROKE PLAY":"GOLF")+" \u2014 "+COURSES[gState.courseKey].name+" ("+TEES[gState.tee].label+")");
    lines.push("");
    gState.players.forEach(p=>{
      let sum=0, netSum=0, any=false;
      allHoles.forEach(h=>{
        const g = gState.scores[h] ? gState.scores[h][p.id] : null;
        if(g!==null && g!==undefined){
          sum+=g; any=true;
          if(isStroke) netSum += g - (gStrokeHoleNumbers(gState.players,p.id).includes(h)?1:0);
        }
      });
      const toPar = sum-71;
      let line = p.name+": "+(any?sum:"\u2014");
      if(any) line += " ("+(toPar===0?"E":(toPar>0?"+"+toPar:String(toPar)))+")";
      if(isStroke && any) line += " \u2014 Net "+netSum;
      lines.push(line);
    });
    return lines.join("\n");
  }

      lines.push((i+1)+". "+p.name+": "+(results.totals[p.id]>0?"+":"")+"$"+results.totals[p.id]);
    });
    lines.push("");
    lines.push("Hole-by-Hole:");
    const holeNums = Object.keys(pState.holes).map(Number).sort((a,b)=>a-b);
    if(holeNums.length===0){
      lines.push("No holes played yet.");
    } else {
      holeNums.forEach(h=>{
        const cats = categoriesForHole(h);
        const winners = results.holeWinners[h] || {};
        const parts = cats.map(c=>{
          const wid = winners[c.key];
          return c.label+": "+(wid ? playerNameIn(pState.players,wid) : "no winner");
        });
        lines.push("Hole "+h+" (Par "+PAR[h]+") \u2014 "+parts.join(", "));
      });
    }
    return lines.join("\n");
  }

    valWrap.appendChild(valInput);
    optCard.appendChild(valWrap);
    optCard.appendChild(el("div","note","$"+mState.betAmount+" \u2014 paid by every losing player to every winning player once the match is decided. A halved match pays nothing."));

    const netLine = el("div","toggle-line");
    netLine.appendChild(el("div","desc","Use net scores (handicap strokes count). On by default \u2014 this is what makes it a handicap match."));
    const netSw = el("label","switch");
    const netCb = el("input"); netCb.type="checkbox"; netCb.checked=!!mState.useNet;
    netCb.onchange = ()=>{ mState.useNet = netCb.checked; mSave(); render(); };
    netSw.appendChild(netCb); netSw.appendChild(el("span","slider"));
    netLine.appendChild(netSw);
    optCard.appendChild(netLine);
    wrap.appendChild(optCard);

    const courseCard = buildCourseCard({
      courseKey: mState.courseKey,
      onCourseChange: (newKey)=>{ mState.courseKey=newKey; mState.tee=firstTeeKeyFor(newKey); mSave(); render(); },
      teeKey: mState.tee,
      onTeeChange: (newTee)=>{ mState.tee=newTee; mSave(); render(); }
    });
    wrap.appendChild(courseCard);

    if(mState.useNet){
      const strokeCard = el("div","card");
      strokeCard.appendChild(el("h2","section-title","Strokes"));
      strokeCard.appendChild(el("div","note", mState.format==="2v2"
        ? "Four-ball allowance: 90% of the handicap difference from the lowest index in the group, applied to "+COURSES[mState.courseKey].name+"'s hardest holes first."
        : "Full handicap difference from the lower index, applied to "+COURSES[mState.courseKey].name+"'s hardest holes first."));
      const table = el("table","ref-table");
      const thead = el("tr");
      ["Player","Index","Strokes","Strokes On Holes"].forEach(t=>thead.appendChild(el("th",null,t)));
      table.appendChild(thead);
      active.forEach(p=>{
        const tr = el("tr");
        tr.appendChild(el("td",null,p.name));
        tr.appendChild(el("td",null,String(p.index)));
        const strokes = mStrokesFor(p.id);
        tr.appendChild(el("td",null,String(strokes)));
        const holes = mStrokeHoleNumbers(p.id);
        tr.appendChild(el("td",null, holes.length?holes.join(", "):"\u2014"));
        table.appendChild(tr);
      });
      strokeCard.appendChild(table);
      wrap.appendChild(strokeCard);
    }

    const demoCard = el("div","card");
    demoCard.appendChild(el("h2","section-title","Demo"));
    demoCard.appendChild(el("div","note","Instantly fill in a full 18-hole round with random scores (birdie to double bogey), so you can see how Match Play works."));
    const simBtn = el("button","btn secondary","\u{1F3B2} Simulate Full Round");
    simBtn.disabled = !teamsValid;
    simBtn.onclick = simulateMatchRound;
    demoCard.appendChild(simBtn);
    wrap.appendChild(demoCard);

    const btnRow = el("div","btn-row");
    const startBtn = el("button","btn","Start Round \u2192");
    startBtn.disabled = !teamsValid;
    startBtn.onclick = ()=>{ if(!mTeamsValid()) return; mState.setupDone=true; mSave(); view="m-play"; render(); };
    btnRow.appendChild(startBtn);
    if(Object.keys(mState.scores).length>0){
      const resetBtn = el("button","btn danger","Reset entire round");
      resetBtn.onclick = ()=>{
        if(confirm("This clears all holes and scores for this round. Continue?")){
          const players=mState.players, teamOf=mState.teamOf, format=mState.format, tee=mState.tee, courseKey=mState.courseKey, useNet=mState.useNet, betAmount=mState.betAmount;
          mState = defaultMState();
          mState.players=players; mState.teamOf=teamOf; mState.format=format; mState.tee=tee; mState.courseKey=courseKey; mState.useNet=useNet; mState.betAmount=betAmount;
          mSave(); render();
        }
      };
      btnRow.appendChild(resetBtn);
    }
    wrap.appendChild(btnRow);
    return wrap;
  }

  // ---- MATCH PLAY: play ----
  function renderMPlay(){
    const wrap = el("div");
    const num = mState.currentHole;
    const active = mActivePlayers();
    if(!mState.scores[num]) mState.scores[num] = {};
    active.forEach(p=>{
      if(mState.scores[num][p.id]===undefined || mState.scores[num][p.id]===null){ mState.scores[num][p.id] = PAR[num]; }
    });

    const head = el("div","card");
    const hh = el("div","hole-head");
    const left = el("div");
    left.appendChild(el("div","hole-num","Hole "+num));
    left.appendChild(el("div","hole-meta","Par "+PAR[num]+" \u00b7 "+TEES[mState.tee].yards[num]+" yds \u00b7 "+TEES[mState.tee].label));
    hh.appendChild(left);
    head.appendChild(hh);
    wrap.appendChild(head);

    const scoreCard = el("div","card");
    scoreCard.appendChild(el("h2","section-title","Scores"));
    scoreCard.appendChild(el("div","note","Par "+PAR[num]+" is filled in by default \u2014 tap a shape or type a score to override."+(mState.useNet?" Net scores decide the hole.":" Gross scores decide the hole.")));
    ["A","B"].forEach(team=>{
      mTeamPlayers(team).forEach(pid=>{
        const p = active.find(x=>x.id===pid);
        const block = el("div","score-entry-block");
        const top = el("div","score-entry-top");
        const getsStroke = mState.useNet && mStrokeHoleNumbers(pid).includes(num);
        const teamTagClass = mState.format==="2v2" ? (team==="A"?"hawk":"other") : "solo";
        const teamTagText = mState.format==="2v2" ? ("Team "+team) : (team==="A"?"Player 1":"Player 2");
        top.innerHTML = '<span class="score-entry-name">'+p.name+'</span> <span class="team-tag '+teamTagClass+'">'+teamTagText+'</span>';
        const gross = mState.scores[num][pid];
        const net = (gross===null||gross===undefined) ? null : gross-(getsStroke?1:0);
        const meta = el("div","score-entry-meta", (getsStroke?"Stroke here \u00b7 ":"")+(mState.useNet ? (net===null?"No score yet":"Net "+net) : ""));
        top.appendChild(meta);
        block.appendChild(top);
        block.appendChild(buildScoreButtonRow(PAR[num], gross, (value)=>{
          mState.scores[num][pid] = value;
          mSave(); render();
        }, "m-score-"+num+"-"+pid));
        scoreCard.appendChild(block);
      });
    });
    wrap.appendChild(scoreCard);

    const resultCard = el("div","card");
    resultCard.appendChild(el("h2","section-title","This Hole"));
    const winner = mHoleWinner(num);
    const bestA = mTeamBest(num,"A"), bestB = mTeamBest(num,"B");
    const teamName = (t)=> mState.format==="2v2" ? ("Team "+t) : playerNameIn(active, mTeamPlayers(t)[0]);
    let holeMsg;
    if(winner===null) holeMsg = "Enter scores to see who wins the hole.";
    else if(winner==="halve") holeMsg = "Halved \u2014 both sides net "+bestA+".";
    else holeMsg = teamName(winner)+" wins the hole, "+Math.min(bestA,bestB)+" to "+Math.max(bestA,bestB)+".";
    resultCard.appendChild(el("div","note",holeMsg));
    wrap.appendChild(resultCard);

    const statusCard = el("div","card");
    statusCard.appendChild(el("h2","section-title","Match Status"));
    const info = matchStatusText();
    statusCard.appendChild(el("div","note",info.text));
    wrap.appendChild(statusCard);

    const navRow = el("div","btn-row");
    if(num>1){
      const prevBtn = el("button","btn secondary","\u2190 Hole "+(num-1));
      prevBtn.onclick = ()=>{ mState.currentHole=num-1; mSave(); render(); };
      navRow.appendChild(prevBtn);
    }
    if(num<18){
      const nextBtn = el("button","btn secondary","Hole "+(num+1)+" \u2192");
      nextBtn.onclick = ()=>{ mState.currentHole=num+1; mSave(); render(); };
      navRow.appendChild(nextBtn);
    } else {
      const finishBtn = el("button","btn","See Summary");
      finishBtn.onclick = ()=>{ view="m-summary"; render(); };
      navRow.appendChild(finishBtn);
    }
    wrap.appendChild(navRow);
    return wrap;
  }

  // ---- MATCH PLAY: standings ----
  function renderMStandings(){
    const wrap = el("div");
    const statusCard = el("div","card");
    statusCard.appendChild(el("h2","section-title","Match Status"));
    const info = matchStatusText();
    statusCard.appendChild(el("div","note",info.text));
    wrap.appendChild(statusCard);

    const results = computeMatchResults();
    const active = mActivePlayers();
    const moneyCard = el("div","card");
    moneyCard.appendChild(el("h2","section-title","Money"));
    const ranked = active.slice().sort((a,b)=>results.totals[b.id]-results.totals[a.id]);
    ranked.forEach((p,i)=>{
      const row = el("div","standing-row");
      row.appendChild(el("div","standing-rank",String(i+1)));
      const label = mState.format==="2v2" ? (p.name+" (Team "+mTeamOf(p.id)+")") : p.name;
      row.appendChild(el("div","standing-name",label));
      const {cls,text} = fmtMoney(results.totals[p.id]);
      row.appendChild(el("div","money "+cls,text));
      moneyCard.appendChild(row);
    });
    wrap.appendChild(moneyCard);
    return wrap;
  }

  // ---- MATCH PLAY: summary ----
  function buildMSummaryText(){
    const results = computeMatchResults();
    const active = mActivePlayers();
    const lines = [];
    lines.push("MATCH PLAY ("+(mState.format==="2v2"?"2 vs 2 Best Ball":"1 vs 1")+") \u2014 "+COURSES[mState.courseKey].name+" ("+TEES[mState.tee].label+")");
    lines.push("$"+mState.betAmount+" per player"+(mState.useNet?", net scores":", gross scores"));
    if(mState.format==="2v2"){
      lines.push("Team A: "+mTeamPlayers("A").map(pid=>playerNameIn(mState.players,pid)).join(" & "));
      lines.push("Team B: "+mTeamPlayers("B").map(pid=>playerNameIn(mState.players,pid)).join(" & "));
    } else {
      lines.push((active[0]?active[0].name:"Player 1")+" vs "+(active[1]?active[1].name:"Player 2"));
    }
    lines.push("");
    lines.push("Status: "+results.info.text);
    lines.push("");
    lines.push("Money:");
    active.slice().sort((a,b)=>results.totals[b.id]-results.totals[a.id]).forEach(p=>{
      lines.push(p.name+": "+(results.totals[p.id]>0?"+":"")+"$"+results.totals[p.id]);
    });
    return lines.join("\n");
  }

  function renderMSummary(){
    const wrap = el("div");
    wrap.appendChild(renderMStandings());

    const shareCard = el("div","card");
    shareCard.appendChild(el("h2","section-title","Share Summary"));
    shareCard.appendChild(el("div","note","Copy this recap to text or email to your group."));
    const textarea = document.createElement("textarea");
    textarea.readOnly = true;
    textarea.style.width = "100%";
    textarea.style.minHeight = "160px";
    textarea.style.background = "var(--pine-dark)";
    textarea.style.color = "var(--cream)";
    textarea.style.border = "1px solid var(--line)";
    textarea.style.borderRadius = "8px";
    textarea.style.padding = "10px 11px";
    textarea.style.fontFamily = "ui-monospace,SFMono-Regular,Menlo,Consolas,monospace";
    textarea.style.fontSize = "0.82rem";
    textarea.style.marginTop = "8px";
    textarea.value = buildMSummaryText();
    shareCard.appendChild(textarea);
    const copyBtn = el("button","btn","Copy to Clipboard");
    copyBtn.style.marginTop = "10px";
    copyBtn.onclick = async ()=>{
      textarea.select();
      try{ await navigator.clipboard.writeText(textarea.value); copyBtn.textContent="Copied!"; }
      catch(e){
        try{ document.execCommand("copy"); copyBtn.textContent="Copied!"; }
        catch(err){ copyBtn.textContent="Select the text above to copy"; }
      }
      setTimeout(()=>{ copyBtn.textContent="Copy to Clipboard"; }, 1500);
    };
    shareCard.appendChild(copyBtn);
    wrap.appendChild(shareCard);
    return wrap;
  }


  async function init(){
    homeCourse = await loadHomeCourse();

    const found = await load();
    if(!found) state = defaultState();
    if(!state.courseKey) state.courseKey = homeCourse;
    savedPlayers = await loadRoster();

    const savedMode = await loadAppMode();
    if(savedMode==="golf"){
      appMode = savedMode;
      gState = await gLoad();
      if(!gState) gState = defaultGState();
      if(!gState.courseKey) gState.courseKey = homeCourse;
      view = gState.setupDone ? "g-play" : "g-setup";
    } else if(savedMode==="points"){
      appMode = "points";
      pState = await pLoad();
      if(!pState) pState = defaultPState();
      if(!pState.courseKey) pState.courseKey = homeCourse;
      view = pState.setupDone ? "p-play" : "p-setup";
    } else if(savedMode==="nassau"){
      appMode = "nassau";
      nState = await nLoad();
      if(!nState) nState = defaultNState();
      if(!nState.courseKey) nState.courseKey = homeCourse;
      view = nState.setupDone ? "n-play" : "n-setup";
    } else if(savedMode==="match"){
      appMode = "match";
      mState = await mLoad();
      if(!mState) mState = defaultMState();
      if(!mState.courseKey) mState.courseKey = homeCourse;
      view = mState.setupDone ? "m-play" : "m-setup";
    } else if(savedMode==="betting"){
      appMode = "betting";
      view = "betting-menu";
    } else if(savedMode==="hawk"){
      appMode = "hawk";
      view = state.setupDone ? "play" : "setup";
    } else {
      appMode = null;
      view = "home";
    }
    render();
  }

  init();
})();
</script>
</body>
</html>
